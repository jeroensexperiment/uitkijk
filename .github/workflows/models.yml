# Builds the YOLO11n object models once and publishes them as the release "models":
#   yolo11n.onnx               (ONNX Runtime, CPU)
#   yolo11n.xml + yolo11n.bin  (OpenVINO, Intel iGPU; same OpenVINO version as requirements.txt)
#   export.log                 (the full conversion output, also when it fails)
# The Home Assistant app downloads them from there instead of converting during installation.
# The Coral uses Google's ready-made SSDLite MobileDet model: a YOLO model for the Edge TPU needs
# the Edge TPU compiler 16, which is no longer published (the one on GitHub, 14.1, crashes on it).
name: Models
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/models.yml]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Export
        run: |
          mkdir -p out work && cd work
          set -o pipefail
          {
            set -ex
            pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
            pip install ultralytics onnx onnxslim "openvino==2026.4.1"
            yolo export model=yolo11n.pt format=onnx imgsz=320 opset=17 simplify=True
            cp yolo11n.onnx ../out/
            yolo export model=yolo11n.pt format=openvino imgsz=320 half=False
            cp yolo11n_openvino_model/yolo11n.xml yolo11n_openvino_model/yolo11n.bin ../out/
          } 2>&1 | tee ../out/export.log
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view models -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create models -R "$GITHUB_REPOSITORY" --title "Object models" \
                 --notes "Built by .github/workflows/models.yml; used by the Home Assistant app."
          gh release upload models out/* --clobber -R "$GITHUB_REPOSITORY"

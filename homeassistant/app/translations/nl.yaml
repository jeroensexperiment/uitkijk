configuration:
  cameras:
    name: Camera's
    description: >-
      Per camera een naam en het merk. Bij een merk vul je IP-adres, gebruiker en wachtwoord in
      (poort alleen als die afwijkt); bij Dahua kies je ook welke substream (1, 2 of 3) voor
      detectie wordt gebruikt. Bij 'other' of UniFi vul je zelf de RTSP-adressen in (main_url en
      eventueel sub_url). faces en plates zetten gezichts- en kentekenherkenning per camera aan.
      Maskers en zones stel je in op de Uitkijk-pagina; die blijven bewaard.
  live_view:
    name: Live beeld
    description: >-
      Het ▶-knopje op de camerategels: live meekijken, ook op volledig scherm (via go2rtc). Uit =
      geen livebeeld; opnames en detectie werken gewoon door.
  storage:
    name: Opslag
    description: >-
      retention_days = dagen dat opnames bewaard blijven, person_days = dagen voor opnames met een
      persoon of de deurbel, max_gb = maximale ruimte; daarboven gaan de oudste opnames eerst weg.
  log_level:
    name: Logniveau
    description: Hoeveel er in het Logboek komt.
  detector:
    name: Detectie op
    description: >-
      Waar het objectmodel draait. auto (aanbevolen) = de Intel-GPU als die werkt, anders de Coral,
      anders de CPU. gpu = YOLO11s op de Intel-GPU: het hele beeld op 640 px (ziet mensen ver weg),
      de uitsnede rond beweging op 320 px. coral = Google Coral (zuinig, maar duidelijk minder
      nauwkeurig). cpu = het lichte YOLO11n op de processor. Werkt de keuze niet, dan valt het terug
      op de CPU; het verbruik zie je bovenaan de Uitkijk-pagina.
  ai_url:
    name: AI-beschrijvingen (Ollama)
    description: >-
      Adres van Ollama op een pc in je thuisnetwerk, bijvoorbeeld http://192.168.1.20:11434. Leeg =
      geen AI-beschrijvingen. Tijdelijk aan en uit zetten doe je op de Uitkijk-pagina onder Manage,
      zonder herstart. Alleen adressen in je eigen netwerk zijn toegestaan.
  ai_model:
    name: AI-model
    description: >-
      Het vision-model in Ollama (eerst op de pc: ollama pull qwen3-vl:4b-instruct). Werkt met een
      grafische kaart met ongeveer 4 GB of meer.
  continuous_days:
    name: Doorlopend opnemen (dagen)
    description: >-
      0 = uit. Anders neemt elke camera 24 uur per dag op (alleen beeld, zonder geluid, in blokken van
      5 minuten) en kun je onder "Rewind" op de Uitkijk-pagina alle camera's tegelijk terugspoelen, bv.
      om te zien wie aan je auto heeft gezeten. Kost vrijwel geen CPU, wel schijfruimte: bij 4 MP
      ongeveer 20-45 GB per camera per dag.
  continuous_gb:
    name: Doorlopend opnemen (max. GB)
    description: Daarboven gaan de oudste blokken als eerste weg. Staat los van de gewone opnames.

configuration:
  cameras:
    name: Cameras
    description: >-
      A name and the brand per camera. With a brand, enter IP address, user and password (port only
      when it differs); with Dahua also choose which sub stream (1, 2 or 3) is used for detection.
      With 'other' or UniFi enter the RTSP addresses yourself (main_url and optionally sub_url).
      faces and plates turn on face and licence plate recognition per camera. Masks and zones are
      set on the Uitkijk page; they are kept.
  live_view:
    name: Live view
    description: >-
      The ▶ button on the camera tiles: watch live, also full screen (through go2rtc). Off = no
      live view; recordings and detection keep working.
  storage:
    name: Storage
    description: >-
      retention_days = days recordings are kept, person_days = days for recordings with a person or
      the doorbell, max_gb = maximum space; above it the oldest recordings go first.
  log_level:
    name: Log level
    description: How much goes into the log.
  detector:
    name: Detection on
    description: >-
      Where the object model runs. auto (recommended) = the Intel iGPU when it works, otherwise the
      Coral, otherwise the CPU. gpu = YOLO11s on the Intel iGPU: the whole frame at 640 px (sees
      people far away), the crop around motion at 320 px. coral = Google Coral (frugal, but clearly
      less accurate). cpu = the light YOLO11n on the processor. When the choice does not work it
      falls back to the CPU; the usage is shown at the top of the Uitkijk page.
  ai_url:
    name: AI descriptions (Ollama)
    description: >-
      Address of Ollama on a PC in your home network, e.g. http://192.168.1.20:11434. Empty = no AI
      descriptions. Switching them on and off for a while is done on the Uitkijk page under Manage,
      without a restart. Only addresses in your own network are allowed.
  ai_model:
    name: AI model
    description: >-
      The vision model in Ollama (on the PC first: ollama pull qwen3-vl:4b-instruct). Needs a graphics
      card with about 4 GB or more.
  continuous_days:
    name: Continuous recording (days)
    description: >-
      0 = off. Otherwise every camera records 24 hours a day (video only, no sound, in 5-minute blocks)
      and "Rewind" on the Uitkijk page scrolls back through all cameras at once, e.g. to see who
      touched your car. Costs next to no CPU, but disk space: at 4 MP about 20-45 GB per camera per day.
  continuous_gb:
    name: Continuous recording (max. GB)
    description: Above this the oldest blocks go first. Separate from the event recordings.

# Uitkijk as a Home Assistant app (add-on). See DOCS.md in this folder.
name: Uitkijk
version: "0.4.4"
slug: uitkijk
description: Local camera system with recordings, detection (CPU or Google Coral) and face/plate recognition
url: https://github.com/jeroensexperiment/uitkijk
arch:
  - amd64
startup: services
boot: auto
# seconds to finish the clip being recorded when the app stops (default 10)
timeout: 30
# RTSP cameras, go2rtc and links in notifications without port juggling (as in docker-compose.yml)
host_network: true
# the web page in the HA sidebar, behind the HA login
ingress: true
ingress_port: 8080
panel_icon: mdi:cctv
panel_title: Uitkijk
webui: "http://[HOST]:[PORT:8080]/"
watchdog: "tcp://[HOST]:[PORT:8080]"
# login of the Mosquitto app and the IP address of this machine for the setup wizard
services:
  - mqtt:want
hassio_api: true
# Google Coral USB, and the Intel iGPU (/dev/dri) for hardware decoding
usb: true
video: true
# recordings in /media/uitkijk: visible in the HA media browser and not part of the app backup;
# config.yaml in /addon_configs/<id>_uitkijk, so File editor or Studio Code Server can open it too
map:
  - media:rw
  - addon_config:rw
# face models (~500 MB) are downloaded again when missing
backup_exclude:
  - "models/*"
# the Configuration tab: cameras and the main settings. They are written into config.yaml at
# every start (masks, zones and other settings from config.yaml are kept); changes made with the
# setup wizard or the configuration editor on the web page come back here by themselves.
options:
  cameras: []
  live_view: true
  storage:
    retention_days: 7
    person_days: 30
    max_gb: 50
  log_level: info
  detector: auto
schema:
  cameras:
    - name: str
      brand: list(reolink|foscam|hikvision|dahua|tapo|unifi|other)
      ip: str?
      port: port?
      username: str?
      password: password?
      sub_stream: list(1|2|3)?
      main_url: str?
      sub_url: str?
      faces: bool?
      plates: bool?
  live_view: bool
  storage:
    retention_days: int(1,365)
    person_days: int(1,365)
    max_gb: int(1,100000)
  log_level: list(debug|info|warning|error)
  detector: list(auto|coral|gpu|cpu)
